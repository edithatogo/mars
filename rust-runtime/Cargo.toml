[package]
name = "mars-earth"
version = "0.1.0"
edition = "2021"
description = "Portable runtime replay for mars ModelSpec artifacts"
license = "Apache-2.0"
repository = "https://github.com/edithatogo/mars"
readme = "README.md"

[lib]
name = "pymars_runtime"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "mars-runtime-cli"
path = "src/bin/mars-runtime-cli.rs"

[dependencies]
anyhow = "1.0.104"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
pyo3 = { version = "0.29.2", features = ["abi3-py312"] }

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "runtime_bench"
harness = false
