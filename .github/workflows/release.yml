name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Build package
        run: uv build --config-setting build-args=--locked

      - name: Inventory exact distributions and frozen runtime dependencies
        run: bash scripts/generate_release_sbom.sh

      - name: Generate resolved Rust SPDX inventory
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .grype-rust-inputs
          syft-version: v1.57.2
          format: spdx-json
          output-file: release-evidence/rust.sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Gate Python release dependencies with Grype
        uses: edithatogo/repository-standards/.github/actions/grype-scan@06a7bd00074b402fe91b2e3ed7a8af806be945e7
        with:
          sbom: release-evidence/python.sbom.cdx.json
          mode: enforce
          artifact-name: grype-python-release
          output-directory: .grype-python-evidence

      - name: Gate resolved Rust dependencies with Grype
        uses: edithatogo/repository-standards/.github/actions/grype-scan@06a7bd00074b402fe91b2e3ed7a8af806be945e7
        with:
          sbom: release-evidence/rust.sbom.spdx.json
          mode: enforce
          artifact-name: grype-rust-release
          output-directory: .grype-rust-evidence

      - name: Retain release inventory and subject binding
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: grype-release-inputs
          path: release-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Verify scanned release inputs are unchanged
        run: sha256sum --check release-evidence/subjects.sha256

      - name: Generate provenance attestation
        uses: actions/attest@v4
        with:
          subject-path: dist/*

      # ── Publish to TestPyPI first (non-blocking gate) ──
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
        continue-on-error: true

      # ── Publish to PyPI (trusted publishing via OIDC) ──
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      # ── Verify the package is installable from PyPI ──
      - name: Wait for PyPI index update
        run: sleep 30

      - name: Install and smoke-test from PyPI
        run: |
          uv venv .venv
          . .venv/bin/activate
          uv pip install mars-earth
          python -c "import pymars; print(f'mars-earth {pymars.__version__} installed successfully')"

      # ── Create GitHub Release ──
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            release-evidence/python.sbom.cdx.json
            release-evidence/rust.sbom.spdx.json
            release-evidence/subjects.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
