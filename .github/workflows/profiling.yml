name: Profiling

on:
  push:
    branches: [main]
    paths:
      - 'pymars/**/*.py'
  workflow_dispatch:

concurrency:
  group: profiling-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev --extra profiling

      - name: Run Scalene profiler
        run: make profile

      - name: Run py-spy on demo
        run: |
          set +e
          uv run py-spy record -o flame_graph.svg -- python -m pymars.demos.basic_regression_demo 2>&1 | tee py-spy.log
          py_spy_status=${PIPESTATUS[0]}
          set -e
          if [[ ! -s flame_graph.svg ]]; then
            echo "py-spy did not produce a flame graph" >&2
            exit "${py_spy_status:-1}"
          fi
          if [[ "$py_spy_status" -ne 0 ]] && ! grep -q "No child process" py-spy.log; then
            exit "$py_spy_status"
          fi

      - name: Upload profiling results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: profiling-results
          path: |
            flame_graph.svg
            py-spy.log
          retention-days: 30
